<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="Segoe UI,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/>
    </marker>
    <style>
      .lyr{fill:#161b22;stroke:#30363d;stroke-width:1.2;rx:8}
      .h{fill:#e6edf3;font-size:14px;font-weight:700}
      .t{fill:#adbac7;font-size:11px}
      .m{fill:#768390;font-size:10px}
      .stage{fill:#1f6feb;font-size:11px;font-weight:700}
      .band{fill:#0d1117;stroke:#21262d;stroke-width:1}
      .chk{fill:#d29922;font-size:10px}
    </style>
  </defs>
  <rect width="1180" height="640" fill="#0d1117"/>
  <text x="24" y="34" fill="#e6edf3" font-size="19" font-weight="700">Collections Analytics — Production Architecture</text>
  <text x="24" y="54" class="m">Raw → Staging → Clean → Golden → Feature → Metrics → Dashboard · medallion pattern on Databricks (Delta Lake)</text>

  <!-- SOURCES -->
  <rect class="lyr" x="24" y="80" width="180" height="180" rx="8"/>
  <text x="34" y="102" class="h">Sources (17 systems)</text>
  <text x="34" y="124" class="t">payments · calls · attempts</text>
  <text x="34" y="140" class="t">dispositions · PTP · targeting</text>
  <text x="34" y="156" class="t">whatsapp · sms · field_visits</text>
  <text x="34" y="172" class="t">accounts · borrowers · agents</text>
  <text x="34" y="188" class="t">agent_sessions · campaigns</text>
  <text x="34" y="204" class="t">vendor_telephony · complaints</text>
  <text x="34" y="220" class="t">account_status_history</text>
  <text x="34" y="244" class="m">Ingest: CDC / batch, append-only</text>

  <!-- RAW / BRONZE -->
  <rect class="lyr" x="232" y="80" width="180" height="180" rx="8"/>
  <text x="242" y="102" class="stage">① RAW (Bronze)</text>
  <text x="242" y="124" class="h" font-size="12">Immutable landing</text>
  <text x="242" y="146" class="t">• exact copy + _ingested_at</text>
  <text x="242" y="162" class="t">• _source_file, _batch_id</text>
  <text x="242" y="178" class="t">• no transforms, full history</text>
  <text x="242" y="200" class="chk">DQ: row counts vs source,</text>
  <text x="242" y="214" class="chk">schema drift capture</text>
  <text x="242" y="238" class="m">Late/duplicate events land here</text>

  <!-- STAGING / CLEAN -->
  <rect class="lyr" x="440" y="80" width="200" height="290" rx="8"/>
  <text x="450" y="102" class="stage">② STAGING → CLEAN (Silver)</text>
  <text x="450" y="126" class="h" font-size="12">Typed, de-duped, conformed</text>
  <text x="450" y="148" class="t">• payments: dedup on payment_id</text>
  <text x="450" y="164" class="t">&#160;&#160;(never payment_reference)</text>
  <text x="450" y="180" class="t">• status filter → is_recovery</text>
  <text x="450" y="196" class="t">• agents: resolve → 1 row/agent_id</text>
  <text x="450" y="212" class="t">• dispositions: PTP→PROMISE_TO_PAY</text>
  <text x="450" y="228" class="t">• timezone: best-effort UTC col</text>
  <text x="450" y="244" class="t">• window &amp; out-of-range guards</text>
  <text x="450" y="268" class="chk">DQ CONTRACTS (fail = quarantine):</text>
  <text x="450" y="282" class="chk">• PK unique &amp; not null</text>
  <text x="450" y="296" class="chk">• amount ≥ 0, valid enums</text>
  <text x="450" y="310" class="chk">• FK accounts/agents resolve</text>
  <text x="450" y="324" class="chk">• freshness &lt; 24h</text>
  <text x="450" y="348" class="m">Idempotent MERGE, incremental by _ingested_at</text>

  <!-- GOLDEN -->
  <rect class="lyr" x="668" y="80" width="200" height="180" rx="8"/>
  <text x="678" y="102" class="stage">③ GOLDEN (Gold)</text>
  <text x="678" y="124" class="h" font-size="12">Business entities</text>
  <text x="678" y="146" class="t">• account_metrics (1/acct)</text>
  <text x="678" y="162" class="t">• fct_payments (recovery)</text>
  <text x="678" y="178" class="t">• dim_agent, dim_account</text>
  <text x="678" y="194" class="t">• fct_interactions (unioned)</text>
  <text x="678" y="216" class="m">PK + lineage tags on every table</text>
  <text x="678" y="234" class="m">SCD-2 for dims; recovery = SUCCESS</text>

  <!-- FEATURE -->
  <rect class="lyr" x="668" y="276" width="200" height="94" rx="8"/>
  <text x="678" y="298" class="stage">④ FEATURE</text>
  <text x="678" y="320" class="t">contact intensity, RPC, DPD band,</text>
  <text x="678" y="336" class="t">tenure*, channel exposure</text>
  <text x="678" y="358" class="m">*tenure flagged unreliable</text>

  <!-- METRICS -->
  <rect class="lyr" x="896" y="80" width="200" height="180" rx="8"/>
  <text x="906" y="102" class="stage">⑤ METRICS (semantic layer)</text>
  <text x="906" y="126" class="h" font-size="12">One definition each</text>
  <text x="906" y="148" class="t">contact_rate · rpc_rate</text>
  <text x="906" y="164" class="t">ptp_rate · ptp_kept_rate</text>
  <text x="906" y="180" class="t">recovery · recovery/agent-hr</text>
  <text x="906" y="196" class="t">cost per ₹ recovered</text>
  <text x="906" y="212" class="m">Versioned metric definitions,</text>
  <text x="906" y="226" class="m">certified &amp; documented</text>

  <!-- DASHBOARD -->
  <rect class="lyr" x="896" y="276" width="200" height="94" rx="8"/>
  <text x="906" y="298" class="stage">⑥ DASHBOARD + ALERTS</text>
  <text x="906" y="320" class="t">Exec 60-sec view · trend,</text>
  <text x="906" y="336" class="t">funnel, causal-null panel</text>
  <text x="906" y="358" class="m">Genie / BI on the semantic layer</text>

  <!-- flow arrows -->
  <line x1="204" y1="170" x2="230" y2="170" stroke="#8b949e" marker-end="url(#a)"/>
  <line x1="412" y1="170" x2="438" y2="170" stroke="#8b949e" marker-end="url(#a)"/>
  <line x1="640" y1="170" x2="666" y2="170" stroke="#8b949e" marker-end="url(#a)"/>
  <line x1="768" y1="260" x2="768" y2="274" stroke="#8b949e" marker-end="url(#a)"/>
  <line x1="868" y1="170" x2="894" y2="170" stroke="#8b949e" marker-end="url(#a)"/>
  <line x1="996" y1="260" x2="996" y2="274" stroke="#8b949e" marker-end="url(#a)"/>

  <!-- cross-cutting band -->
  <rect class="band" x="24" y="398" width="1072" height="96" rx="8"/>
  <text x="36" y="420" class="h">Cross-cutting</text>
  <text x="36" y="444" class="t">🕓 <tspan class="t">Late-arriving data:</tspan> event_at = business time, _ingested_at = load time; windowed re-aggregation + watermark on _ingested_at.</text>
  <text x="36" y="464" class="t">🔁 <tspan class="t">Backfills:</tspan> partition-scoped, idempotent MERGE; recompute affected month partitions only.</text>
  <text x="36" y="484" class="t">📈 <tspan class="t">Incremental:</tspan> Delta CDF; only changed partitions flow downstream.</text>
  <text x="596" y="444" class="t">🚨 <tspan class="t">Monitoring:</tspan> freshness, row-count deltas, null/dup rates, metric drift vs 28-day baseline.</text>
  <text x="596" y="464" class="t">🔍 <tspan class="t">Anomaly detection:</tspan> z-score/STL on recovery &amp; contact rates; page on &gt;3σ or contract breach.</text>
  <text x="596" y="484" class="t">🧬 <tspan class="t">Lineage:</tspan> column-level (Unity Catalog); every metric traces to raw rows.</text>

  <!-- data contract callout -->
  <rect class="band" x="24" y="510" width="1072" height="106" rx="8"/>
  <text x="36" y="532" class="h">Data contract (example — payments)</text>
  <text x="36" y="554" class="t">PK: payment_id (unique, not null) · FK: account_id → accounts · amount: double ≥ 0 · payment_status ∈ {SUCCESS,FAILED,PENDING,REVERSED}</text>
  <text x="36" y="574" class="t">event_at: timestamp, not null · payment_reference: NON-unique (documented) · recovery := payment_status='SUCCESS' after payment_id dedup</text>
  <text x="36" y="596" class="chk">Breach policy: hard-fail unique/FK/enum violations → quarantine table + alert; soft-warn on freshness; nothing reaches Gold until contracts pass.</text>
</svg>
